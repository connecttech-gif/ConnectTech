<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectTech</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Botão de menu (3 barrinhas) -->
  <button id="btn-menu" aria-label="Abrir menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Aba lateral do menu -->
  <nav id="menu-lateral">
    <ul id="lista-paginas">
      <!-- As páginas serão inseridas aqui -->
    </ul>
  </nav>

  <!-- Capa do site -->
  <header id="capa">
    <img src="" alt="Imagem de capa" id="imagem-capa">

    <!-- Caixa de boas-vindas -->
    <section id="boas-vindas">
      <p>Escreva aqui sua mensagem de boas-vindas ou descrição do site.</p>
    </section>

    <!-- Botões de página (somem quando o menu abre) -->
    <div id="botoes-paginas">
      <button>Página 1</button>
      <button>Página 2</button>
      <button>Página 3</button>
      <button>Página 4</button>
      <button>Página 5</button>
    </div>
  </header>

  <!-- Banners giratórios -->
  <section id="banners" class="carrossel-banners">
    <div class="banners-lista">
      <div class="banner-item" style="background-color:#4db6ac;">Banner 1</div>
      <div class="banner-item" style="background-color:#4d9db6;">Banner 2</div>
      <div class="banner-item" style="background-color:#4d6bb6;">Banner 3</div>
    </div>
    <div class="banners-pontos" id="banners-pontos"></div>
  </section>

  <!-- Vitrines -->
  <main class="vitrine" id="vitrines">

    <div class="vitrine-item">
      <div class="vitrine-imagem">Imagem</div>
      <div class="vitrine-texto">
        <p>Descrição do produto ou serviço.</p>
        <a href="#" class="botao-link">Saiba mais</a>
        <button class="botao-remover">Remover</button>
      </div>
    </div>

    <div class="vitrine-item">
      <div class="vitrine-imagem">Imagem</div>
      <div class="vitrine-texto">
        <p>Descrição do produto ou serviço.</p>
        <a href="#" class="botao-link">Saiba mais</a>
        <button class="botao-remover">Remover</button>
      </div>
    </div>

  </main>

  <!-- Botões de navegação entre páginas -->
  <div id="navegacao-paginas">
    <button id="pagina-anterior">Anterior</button>
    <button id="proxima-pagina">Próxima</button>
  </div>

  <!-- Rodapé -->
  <footer id="rodape">
    <div id="links-politicas">
      <a href="#">Política de Privacidade</a>
      <a href="#">Política de Cookies</a>
      <a href="#">Mapa do Site</a>
      <a href="#">Contato</a>
    </div>
    <div id="redes-sociais">
      <a href="#" id="link-instagram">Instagram</a>
      <a href="#" id="link-facebook">Facebook</a>
      <a href="#" id="link-linkedin">LinkedIn</a>
    </div>
  </footer>

  <!-- Botão flutuante do WhatsApp -->
  <a id="botao-whatsapp" href="#">WhatsApp</a>

  <script src="script.js"></script>
</body>
</html>
